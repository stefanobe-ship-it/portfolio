<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Accesso riservato</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2318302c'/><circle cx='32' cy='32' r='16' fill='none' stroke='%23d9e4b8' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5ef; --surface:#ffffff; --ink:#1d2523; --muted:#5d6763; --line:#dcd8cc;
  --accent:#2f5d50; --accent-soft:#e6ede4; --cover:#18302c; --cover-ink:#f3eee2; --cover-acc:#d9e4b8;
  --tag:#2f5d50; --tag-bg:#e3ece3; --link:#1f7a78;
  --sans:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#18201e; --ink:#e7e4da; --muted:#9aa49f; --line:#2c3633;
  --accent:#a9c9a0; --accent-soft:#1f2b27; --tag:#c9dcb0; --tag-bg:#22302b; --link:#7cc6c2;
}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#18201e; --ink:#e7e4da; --muted:#9aa49f; --line:#2c3633;
  --accent:#a9c9a0; --accent-soft:#1f2b27; --tag:#c9dcb0; --tag-bg:#22302b; --link:#7cc6c2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--link)}
/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--cover);color:var(--cover-ink)}
.lock form{width:100%;max-width:360px;display:grid;gap:14px}
.lock h1{margin:0;font-weight:300;font-size:28px;letter-spacing:.04em}
.lock p{margin:0;color:#b9c4bc;font-size:15px}
.lock input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3b5550;background:#10221f;color:var(--cover-ink);font:inherit;font-size:16px}
.lock input:focus{outline:2px solid var(--cover-acc);outline-offset:1px}
.lock label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:#b9c4bc}
.lock button{padding:12px;border:0;border-radius:10px;background:var(--cover-acc);color:#18302c;font:700 16px var(--sans);cursor:pointer}
.lock .err{color:#f0a8a0;min-height:1.2em;font-size:14px}
/* topbar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .name{font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* cover */
.cover{position:relative;overflow:hidden;background:var(--cover);color:var(--cover-ink);padding:72px max(16px,calc((100vw - 1120px)/2)) 56px}
.cover .rings{position:absolute;right:-80px;top:-60px;width:min(560px,90vw);fill:none;stroke:#6f8f86;stroke-width:.7;opacity:.45}
.cover>*{position:relative}
.eyebrow{margin:0 0 28px;color:var(--cover-acc);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.title{margin:0;line-height:.95;font-size:clamp(56px,11vw,104px)}
.title span{display:block;font-weight:300;letter-spacing:.04em}
.title strong{display:block;font-weight:700}
.themes{margin:28px 0 0;font-size:clamp(17px,2.4vw,22px);letter-spacing:.05em;text-transform:uppercase}
.lede{max-width:30em;margin:28px 0 0;font-weight:300;color:#d6dccf;font-size:19px}
.meta{margin:40px 0 0;padding-top:16px;border-top:1px solid #3b5550;font-size:14px;color:#b9c4bc;max-width:640px}
.meta b{color:var(--cover-acc);text-transform:uppercase;letter-spacing:.06em}
/* layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:56px;max-width:1120px;margin:0 auto;padding:40px 16px 96px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;font-size:14px;line-height:1.4;padding-right:8px}
.toc-h{margin:0 0 12px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.toc ol{list-style:none;margin:0;padding:0}
.toc>ol>li{margin:0 0 6px}
.toc>ol>li>a{font-weight:700}
.toc a{display:flex;gap:8px;color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:6px}
.toc a span{color:var(--muted);min-width:1.4em}
.toc a:hover{background:var(--accent-soft)}
.toc a.active{background:var(--accent-soft);color:var(--accent)}
.toc li ol{display:none;margin:2px 0 6px 18px;border-left:1px solid var(--line)}
.toc li.open ol{display:block}
.toc li ol a{color:var(--muted);font-size:13px}
.doc{max-width:720px;min-width:0}
.doc h2{font-size:clamp(26px,4vw,34px);line-height:1.2;margin:72px 0 24px;letter-spacing:-.01em}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:22px;line-height:1.3;margin:48px 0 14px}
.doc h4{font-size:18px;margin:32px 0 10px}
.doc .num{color:var(--accent);margin-right:.25em}
.doc h2 .num{display:block;font-size:.55em;letter-spacing:.1em;margin-bottom:6px}
.tag{display:inline-block;vertical-align:middle;margin-left:.3em;padding:2px 8px;border-radius:999px;background:var(--tag-bg);color:var(--tag);font-size:12px;font-weight:700;letter-spacing:.06em;line-height:1.6}
.doc p{margin:0 0 14px}
.doc ul{margin:0 0 16px;padding-left:22px}
.doc li{margin:0 0 6px}
.doc strong{font-weight:700}
.doc hr.end{border:0;height:1px;background:var(--line);width:40%;margin:56px auto}
.table-wrap{overflow-x:auto;margin:20px 0 24px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th{text-align:left;font-weight:700;padding:10px 12px 8px 0;border-bottom:1px solid var(--ink);vertical-align:bottom}
td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
tr:last-child td{border-bottom:0}
.toc-btn{display:none}
@media (max-width:900px){
  body{font-size:17px}
  .layout{grid-template-columns:minmax(0,1fr);padding-top:28px}
  .toc{position:fixed;inset:0;top:59px;max-height:none;z-index:15;background:var(--bg);padding:20px 16px 40px;display:none}
  .toc.show{display:block}
  .toc-btn{display:inline-block}
  .cover{padding-top:48px}
}
@media print{.bar,.toc{display:none}.layout{display:block}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="f" autocomplete="off">
    <h1>Accesso riservato</h1>
    <p>Inserisci la password per aprire il documento.</p>

    <button type="submit" id="go">Apri</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden>
  <div class="bar">
    <button class="toc-btn" id="tocBtn" aria-controls="toc" aria-expanded="false">Indice</button>
    <span class="name">Time Slip · Dossier narrativo</span>
    <button id="theme" aria-label="Cambia tema chiaro/scuro">Tema</button>
    <button id="out" aria-label="Esci">Esci</button>
    <div class="progress" id="prog"></div>
  </div>
  <div id="content"></div>
</div>

const K='ts-dossier-pw';
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
  return new TextDecoder().decode(pt);
}
function store(get,k,v){try{const s=localStorage;if(get)return s.getItem(k);v==null?s.removeItem(k):s.setItem(k,v)}catch(e){return null}}
async function unlock(pw,remember){
  const htmlStr=await decrypt(pw);
  if(remember)store(false,K,pw);
  document.getElementById('content').innerHTML=htmlStr;
  document.getElementById('lock').remove();
  document.getElementById('app').hidden=false;
  document.title='Time Slip — Dossier narrativo';
  setup();
  if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),err=document.getElementById('err');
  b.disabled=true;b.textContent='Apertura…';err.textContent='';
  try{await unlock(document.getElementById('pw').value,document.getElementById('rem').checked)}
  catch(x){err.textContent='Password non corretta.';b.disabled=false;b.textContent='Apri'}
});
const saved=store(true,K);
if(saved)unlock(saved,false).catch(()=>store(false,K,null));

function setup(){
  const root=document.documentElement;
  const th=store(true,'ts-theme');if(th)root.dataset.theme=th;
  document.getElementById('theme').onclick=()=>{
    const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark';store(false,'ts-theme',root.dataset.theme);
  };
  document.getElementById('out').onclick=()=>{store(false,K,null);location.reload()};
  const toc=document.getElementById('toc'),btn=document.getElementById('tocBtn');
  btn.onclick=()=>{const s=toc.classList.toggle('show');btn.setAttribute('aria-expanded',s)};
  toc.addEventListener('click',e=>{if(e.target.closest('a')){toc.classList.remove('show');btn.setAttribute('aria-expanded',false)}});
  const links=[...toc.querySelectorAll('a')],map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const heads=[...document.querySelectorAll('.doc h2,.doc h3')].filter(h=>map.has(h.id));
  const prog=document.getElementById('prog');
  let cur=null;
  function onScroll(){
    const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
    let a=null;for(const x of heads){if(x.getBoundingClientRect().top<120)a=x;else break}
    if(a!==cur){cur=a;links.forEach(l=>l.classList.remove('active'));toc.querySelectorAll('li.open').forEach(l=>l.classList.remove('open'));
      if(a){const l=map.get(a.id);l.classList.add('active');const top=l.closest('.toc>ol>li');if(top)top.classList.add('open');
        if(!toc.classList.contains('show')&&getComputedStyle(toc).position==='sticky')l.scrollIntoView({block:'nearest'})}}
  }
  addEventListener('scroll',onScroll,{passive:true});onScroll();
}
</script>
